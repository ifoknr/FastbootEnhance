name: فكرة · Idea
description: اقترح ميزة أو تحسين · Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: وش المشكلة اللي تحلها؟ · What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: الفكرة · The idea
      description: كيف تتخيلها داخل البرنامج؟ · How do you picture it in the app?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: الجوال (اختياري) · Phone (optional)
