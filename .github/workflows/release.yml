name: Release

# Builds Fastboot Studio on Windows, publishes a GitHub release with the zip and the
# CHANGELOG section of that version, then posts it to Telegram.
#
# Run it from the Actions tab (Release -> Run workflow -> version, e.g. v2.0.0), or push a
# tag such as v2.1.0 and it runs by itself.
# CHANGELOG.md needs a "## <version>" section first; it becomes the release notes and
# the Telegram caption. A release made here uses GITHUB_TOKEN, which does not start
# other workflows, so the Telegram post is sent from this workflow, not telegram.yml.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v2.0.0"
        required: true
      prerelease:
        description: "Test build (pre-release, silent Telegram post)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Not VERSION: MSBuild reads environment variables as properties, and a $(Version)
  # of "v2.0.0" breaks NuGet restore and the assembly version.
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  test:
    name: core tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test the core library
        run: dotnet test tests/FastbootEnhance.Core.Tests/FastbootEnhance.Core.Tests.csproj -c Release

  build:
    name: build (windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        shell: bash
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The version must look like v2.0.0, got '$RELEASE_VERSION'."
            exit 1
          fi
          if ! grep -qx "## $RELEASE_VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $RELEASE_VERSION' section; add one first."
            exit 1
          fi
          # The version is written in four places; all of them must match the release.
          number="${RELEASE_VERSION#v}"
          for check in "FastbootEnhance.csproj:<Version>$number</Version>" \
                       "MainWindow.xaml.cs:const string version = \"$number\";" \
                       "MainWindow.xaml:Text=\"v$number\"" \
                       "Themes/Styles.xaml:Text=\"v$number\""; do
            if ! grep -qF "${check#*:}" "${check%%:*}"; then
              echo "::error::${check%%:*} does not say version $number; update it before releasing."
              exit 1
            fi
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single file
        run: >
          dotnet publish FastbootEnhance.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -o publish

      - name: Package
        shell: pwsh
        run: |
          foreach ($f in 'FastbootStudio.exe', 'fastboot.exe', 'adb.exe', 'AdbWinApi.dll', 'AdbWinUsbApi.dll', 'platform-tools-NOTICE.txt') {
            if (-not (Test-Path (Join-Path publish $f))) { throw "$f missing from publish output" }
          }
          Get-ChildItem publish -Filter *.pdb | Remove-Item
          Copy-Item LICENSE publish/LICENSE.txt
          $zip = "FastbootStudio-$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: FastbootStudio-*-win-x64.zip
          if-no-files-found: error

  release:
    name: publish and announce
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ inputs.prerelease || false }}
        run: |
          if gh release view "$RELEASE_VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $RELEASE_VERSION already exists."
            exit 1
          fi
          zip=$(ls out/FastbootStudio-*-win-x64.zip)
          {
            awk -v v="## $RELEASE_VERSION" '$0 == v { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md
            echo
            echo "---"
            echo "**Download** \`$(basename "$zip")\`, unzip it anywhere and run \`FastbootStudio.exe\`. Nothing to install: .NET, adb and fastboot are included."
            echo
            echo "Full changelog: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_VERSION/CHANGELOG.md) · [README](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_VERSION/README.md) · [العربية](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_VERSION/README.ar.md)"
          } > notes.md
          cat notes.md
          flags=()
          [ "$PRE" = true ] && flags+=(--prerelease)
          gh release create "$RELEASE_VERSION" "$zip" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fastboot Studio $RELEASE_VERSION" --notes-file notes.md "${flags[@]}"
          echo "FILE=$zip" >> "$GITHUB_ENV"
          echo "TAG=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "PRE=$PRE" >> "$GITHUB_ENV"

      - name: Notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_TOPIC: ${{ secrets.TELEGRAM_TOPIC }}
          TOOL: FastbootStudio
          ICON: "🧰"
          LAYER: "أداة ويندوز للفاستبوت والتفليش وصور super والنسخ الاحتياطي"
          REQUIRES: "Windows 10/11 64-bit (بدون تثبيت)"
          AUTO_UPDATE: "false"
          VERSION: ${{ inputs.version || github.ref_name }}
        run: bash .github/scripts/telegram-release.sh

      # The winget manifests of this release (packaging/winget/README.md), as an artifact.
      - name: Write winget manifests
        if: env.PRE != 'true'
        run: bash .github/scripts/winget-manifests.sh "$RELEASE_VERSION" "$FILE" winget

      - uses: actions/upload-artifact@v4
        if: env.PRE != 'true'
        with:
          name: winget-manifests
          path: winget/

      # Once Fastboot Studio is in winget, each release is sent there by itself. That needs a
      # classic token with the public_repo scope in the WINGET_TOKEN secret; without it this
      # is skipped.
      - name: Check for a winget token
        id: winget
        if: env.PRE != 'true'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: echo "enabled=$([ -n "$WINGET_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Submit to winget
        if: steps.winget.outputs.enabled == 'true'
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: IFOKNR.FastbootStudio
          release-tag: ${{ env.RELEASE_VERSION }}
          installers-regex: 'win-x64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
